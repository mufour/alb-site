spring:
  datasource:
    url: jdbc:h2:file:./data/albdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  upload:
    dir: uploads
